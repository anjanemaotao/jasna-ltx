name: Hourly Auto Sync Official LTX

on:
  schedule:
    # 每小时整点自动执行 (UTC 时间每小时第 0 分)
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/sync_playwright.js'
  workflow_dispatch: # 支持在 GitHub 页面上一键手动立即运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Browsers
        run: |
          npm ci || npm install
          npx playwright install chromium --with-deps

      - name: Run Cloud Headless Sync
        run: node scripts/sync_playwright.js

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/movies.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): 自动同步官方原站最新数据 [skip ci]" && git push)
