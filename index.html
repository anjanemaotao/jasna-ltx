<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jasna-LTX 资源库</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e83e8c'/><text y='70' x='18' font-size='65' fill='white' font-family='sans-serif' font-weight='bold'>J</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部导航条 -->
  <header class="banner">
    <div class="brand-group">
      <a href="/" class="brand-logo">Jasna-LTX</a>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="global-search" placeholder="搜索番号、女优、片商 (/)">
      </div>
    </div>

    <div class="nav-controls">
      <div class="sort-group">
        <button class="sort-btn active" data-sort="score">★ 按评分</button>
        <button class="sort-btn" data-sort="date">📅 按日期</button>
        <button class="sort-btn" data-sort="added">🕒 按入库</button>
        <button class="sort-btn" data-sort="size">💾 按大小</button>
        <button class="sort-btn" data-sort="code"># 按番号</button>
      </div>

      <button class="icon-btn" id="btn-shuffle" title="随机排列">🎲 随机</button>
      <button class="icon-btn" id="btn-want" title="仅查看想看">❤️ 想看 <span id="want-count" class="badge">0</span></button>
      <button class="icon-btn" id="btn-submit">➕ 提交资源</button>
      <button class="icon-btn" id="btn-settings">⚙️ 设置</button>
    </div>
  </header>

  <!-- 工作区 -->
  <div class="workspace">
    <!-- 左侧女优侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-search">
        <input type="text" id="actor-search" placeholder="筛选女优名字...">
      </div>
      <div class="actor-list" id="actor-list">
        <!-- 动态生成女优分类 -->
      </div>
    </aside>

    <!-- 主展示区 -->
    <main class="main-content">
      <div class="sub-header">
        <div class="tabs-group">
          <button class="tab-btn active" data-filter="all">全部 <span id="tab-count-all">0</span></button>
          <button class="tab-btn" data-filter="confirmed">已确认 <span id="tab-count-confirmed">0</span></button>
          <button class="tab-btn" data-filter="unconfirmed">待确认 <span id="tab-count-unconfirmed">0</span></button>
        </div>

        <div class="bar-end">
          <button class="icon-btn" id="btn-filter-drawer">🔽 标签筛选</button>
          <button class="icon-btn" id="btn-batch">📦 批量操作 (<span id="batch-count">0</span>)</button>
          <span class="updated-tag" id="update-indicator" title="最后一次检查与新增时间">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span id="update-time-text">资源更新于 11/14 10:10</span>
          </span>
        </div>
      </div>

      <!-- 作品卡片流 -->
      <div class="grid-cards" id="cards-container">
        <!-- 动态注入作品卡片 -->
      </div>

      <!-- 无限滚动哨兵 -->
      <div id="sentinel" style="height: 40px; margin-top: 20px;"></div>
    </main>
  </div>

  <!-- 批量操作弹窗 -->
  <div class="modal-overlay" id="modal-batch">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">批量操作</div>
        <button class="close-btn" data-close="modal-batch">&times;</button>
      </div>
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
        当前选中 <strong id="batch-modal-count" style="color: var(--color-primary)">0</strong> 部作品 · 共 <strong id="batch-modal-size" style="color: var(--color-primary)">0 GB</strong>
      </div>
      <div class="form-group">
        <textarea id="batch-links-text" rows="10" readonly placeholder="链接生成中..."></textarea>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="download-btn" id="btn-copy-all-links" style="flex: 1; padding: 10px;">📋 复制全部链接</button>
        <button class="copy-btn" id="btn-push-all-download" style="flex: 1; padding: 10px;">🚀 一键推送到下载器</button>
      </div>
    </div>
  </div>

  <!-- 设置与下载器集成弹窗 -->
  <div class="modal-overlay" id="modal-settings">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">通用与下载器集成设置</div>
        <button class="close-btn" data-close="modal-settings">&times;</button>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="setting-trim-filename" checked> 复制时精简 ed2k 文件名（仅保留番号）</label>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="setting-show-zh" checked> 优先展示中文翻译标题</label>
      </div>
      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;">
      <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--color-primary);">Aria2 RPC 配置</div>
      <div class="form-group">
        <label>RPC 接口地址</label>
        <input type="text" id="setting-aria2-url" placeholder="http://localhost:6800/jsonrpc">
      </div>
      <div class="form-group">
        <label>RPC Token 密钥</label>
        <input type="password" id="setting-aria2-token" placeholder="留空则无密钥">
      </div>
      <div class="form-group">
        <label>保存路径</label>
        <input type="text" id="setting-aria2-dir" placeholder="如 D:/Downloads/LTX">
      </div>
      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;">
      <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--color-subtitle);">115 网盘云下载设置</div>
      <div class="form-group">
        <label>默认保存目录 CID</label>
        <input type="text" id="setting-115-cid" placeholder="115 目录唯一 CID，如 0">
      </div>
      <button class="download-btn" id="btn-save-settings" style="width: 100%; padding: 10px; margin-top: 10px;">💾 保存配置</button>
    </div>
  </div>

  <!-- Toast 提示条 -->
  <div class="toast" id="toast">
    <span id="toast-text">已复制到剪贴板</span>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
